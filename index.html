<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The Fic Shelf</title><link rel="stylesheet" href="style.css"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script defer src="config.js"></script><script defer src="app.js"></script><script defer src="tag-picker.js"></script>
</head>
<body>
  <header class="topbar"><div class="logo"><span class="symbol">🐻🐧</span><span>kaisoo fic library</span></div><span class="subhead"></span></header>
  <main class="shell">
    <section class="toolbar"><div class="search-wrap"><span>⌕</span><input id="search" placeholder="Search titles, authors, summaries, tags…" aria-label="Search fics"></div><select id="sourceFilter" aria-label="Filter by source"><option value="">All sources</option><option value="ao3">AO3</option><option value="unsorted">Unknown / Unsorted</option></select><div class="tag-picker" id="tagPicker"><select id="tagFilter" class="tag-picker-native" aria-label="Filter by detected tag" tabindex="-1"><option value="">All tags</option></select><button type="button" class="tag-picker-trigger" id="tagPickerTrigger" aria-haspopup="listbox" aria-expanded="false"><span id="tagPickerLabel">All tags</span><span aria-hidden="true">⌄</span></button><div id="tagPickerPanel" class="tag-picker-panel" hidden><input id="tagPickerSearch" type="search" autocomplete="off" placeholder="Search tags…" aria-label="Search tags"><div id="tagPickerList" class="tag-picker-list" role="listbox" aria-label="Detected tags"></div></div></div><select id="fandomFilter" aria-label="Filter by fandom"><option value="">All fandoms</option></select><select id="sort" aria-label="Sort fics"><option value="added">Recently added</option><option value="title">Title A–Z</option><option value="author">Author A–Z</option><option value="words">Longest first</option></select></section>
    <section class="reader-tools" aria-label="Reader tools"><div class="reader-tool-left"><button type="button" id="allWorksBtn" class="reader-control active" aria-pressed="true">All fics</button><button type="button" id="readingListBtn" class="reader-control" aria-pressed="false">♡ Save for Later <span id="savedCount">0</span></button><button type="button" id="surpriseBtn" class="reader-control">✧ Surprise Me!</button></div><div class="reader-tool-right" role="group" aria-label="Library display"><button type="button" id="cardViewBtn" class="reader-control active" aria-pressed="true">▦ Cards</button><button type="button" id="compactViewBtn" class="reader-control" aria-pressed="false">☷ Compact</button></div></section><div class="list-heading"><h2>Browse the library <span id="ficCount">0</span></h2><span id="note"></span></div>
    <div id="library" class="library"></div><div id="empty" class="empty"><div class="empty-symbol">✧</div><h2>No fics yet</h2><p>The catalog has not been published, or no stories match your filters.</p></div>
  </main>
  <dialog id="detailDialog" class="detail-dialog"><div class="dialog-body"><button class="close" id="closeDetail" aria-label="Close">×</button><p id="detailFilename" class="eyebrow"></p><h2 id="detailTitle"></h2><p class="muted" id="detailAuthor"></p><div id="detailTags" class="tags"></div><p id="detailSummary" class="summary"></p><div class="detail-meta" id="detailMeta"></div><section class="similar-section"><h3>Similar fics</h3><div id="similarFics" class="similar-grid"></div></section><div class="action-row"><button type="button" id="saveDetailBtn" class="outlined" aria-pressed="false">♡ Save for Later</button><a id="downloadBtn" class="primary download-link" download>↓ Download fic</a><span id="downloadStatus" class="download-status" aria-live="polite"></span></div></div></dialog>
  <footer>Stories belong to their respective authors. Downloads provided in the original saved format.</footer>
</body></html>
